# Robot vérificateur de QuizArena
# Emplacement : .github/workflows/ci.yml

name: CI

# Le robot se lance à chaque pull request,
# et à chaque fois que du code entre dans main.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------- Contrôle du serveur (dossier api/) ----------
  api:
    name: Serveur (api)
    runs-on: ubuntu-latest

    # Une base MongoDB temporaire, utilisée seulement pendant les tests
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le code TypeScript
        run: npm run typecheck

      - name: Préparer la configuration de test
        run: cp .env.test.example .env.test

      - name: Lancer les tests
        run: npm test

  # ---------- Contrôle de l'application (dossier app/) ----------
  app:
    name: Application (app)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyser le code
        run: flutter analyze

      - name: Lancer les tests
        run: flutter test